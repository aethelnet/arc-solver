[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-solver"
version = "0.4.3"
description = "Autonomous Neurosymbolic Causal Solver for ARC-AGI-3 (Active Inference, Macro Intent Compiler, Sokoban Deadlock Veto, Qwen 3.8B vLLM)"
authors = [
    { name = "Aethelnet Network", email = "research@aethelburg.network" }
]
license = { text = "AGPL-3.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kaggle_arc*", "auratic_core*"]
